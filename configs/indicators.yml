# Phase 6 Structure 
# ================================
# Defines indicators for small-area analysis of Chinese immigrant integration
# in Manchester (1981, 1991, 2001)
#
# Structure:
#   Each indicator has:
#   - table: SAS table (02, 04, 07, 10)
#   - code: SAS variable code (e.g., 81sas100929)
#   - description: Human-readable description
#   - type: 'raw' (count), 'denominator' (for calculating rates), or 'rate' (derived)
#   - denominator: (for rates) reference to denominator indicator
#
# Naming convention:
#   - Raw counts: [DOMAIN]_[MEASURE] (e.g., TOTAL_RES, CHINESE_BORN)
#   - Denominators: TOTAL_[DOMAIN] (e.g., TOTAL_RES, TOTAL_HH)
#   - Percentages: PCT_[MEASURE] (e.g., PCT_CHINESE_BORN)
#   - Rates: [MEASURE]_RATE (e.g., EMP_RATE)

years:
  1981:
    # =====================================================
    # SAS02: DEMOGRAPHIC BASE (Total Population by Age/Sex)
    # =====================================================
    TOTAL_RES:
      table: sas02
      code: 81sas020050
      description: "All ages TOTAL Persons (Residents in households)"
      type: denominator
      note: "Universe: All persons; base denominator for population rates"
    
    PCT_MALE:
      table: sas02
      code: 81sas020051
      description: "Males as % of total population"
      type: rate
      denominator: TOTAL_RES
      calculation: "100 * 81sas020051 / TOTAL_RES"
      note: "Optional: Sex structure indicator"
    
    PCT_FEMALE:
      table: sas02
      code: 81sas020054
      description: "Females as % of total population"
      type: rate
      denominator: TOTAL_RES
      calculation: "100 * 81sas020054 / TOTAL_RES"
      note: "Optional: Sex structure indicator"

    # =====================================================
    # SAS04: COUNTRY OF BIRTH (Chinese / Far East Presence)
    # =====================================================
    CHINESE_BORN:
      table: sas04
      code: 81sas040359
      description: "Total persons born in Far East"
      type: raw
      note: "Universe: All persons; includes China, Hong Kong, Taiwan, etc."
    
    CHINESE_BORN_MALE:
      table: sas04
      code: 81sas040360
      description: "Males born in Far East"
      type: raw
    
    CHINESE_BORN_FEMALE:
      table: sas04
      code: 81sas040361
      description: "Females born in Far East"
      type: raw
    
    PCT_CHINESE_BORN:
      table: sas04
      code: 81sas040359
      description: "Far East-born as % of total population"
      type: rate
      denominator: TOTAL_RES
      calculation: "100 * CHINESE_BORN / TOTAL_RES"
      note: "Key integration indicator: ethnic presence"

    # =====================================================
    # SAS07: EMPLOYMENT (Economic Position - Ages 16+)
    # =====================================================
    ALL_EMPLOYED:
      table: sas07
      code: 81sas070615
      description: "All persons in employment (ages 16+)"
      type: raw
      note: "Includes all employed persons (full-time + part-time)"
    
    EMP_RATE:
      table: sas07
      code: 81sas070615
      description: "Employment rate (ages 16+)"
      type: rate
      denominator: null
      calculation: "100 * ALL_EMPLOYED / (population aged 16+)"
      note: "Note: 1981 SAS07 does not include unemployment, only employment status"
      note: "Registered unemployed"
    
    EMP_RATE:
      table: sas07
      code: 81sas070615
      description: "Employment rate: employed as % of all persons"
      type: rate
      calculation: "100 * ALL_EMPLOYED / TOTAL_RES"
      note: "1981 SAS07 contains detailed employment categories (full-time, part-time, self-employed, etc) but no unemployment count"

    # NOTE: UNEMP_RATE not available in 1981 SAS07 (no unemployment data in this table)

    # =====================================================
    # SAS10: HOUSING & TENURE (Housing Quality, Tenure, Amenities)
    # =====================================================
    TOTAL_HH:
      table: sas10
      code: 81sas100929
      description: "Households with residents (TOTAL tenure)"
      type: denominator
      note: "Universe: Households; base for housing indicators"
    
    # === TENURE ===
    OWNER_OCC_HH:
      table: sas10
      code: 81sas100967
      description: "Owner-occupied households"
      type: raw
      note: "Tenure indicator; candidate codes: 81sas100967 or 81sas100968 (TBD)"
    
    PCT_OWNER_OCC:
      table: sas10
      code: 81sas100967
      description: "Owner-occupied households as % of total"
      type: rate
      denominator: TOTAL_HH
      calculation: "100 * OWNER_OCC_HH / TOTAL_HH"
    
    SOCIAL_RENT_HH:
      table: sas10
      code: 81sas100989  # Council + housing association combined
      description: "Social renting households (council + HA)"
      type: raw
      note: "Universe: Households; combines council (81sas100989) + housing association"
    
    PCT_SOCIAL_RENT:
      table: sas10
      code: 81sas100989
      description: "Social renting households as % of total"
      type: rate
      denominator: TOTAL_HH
      calculation: "100 * SOCIAL_RENT_HH / TOTAL_HH"
    
    # === CAR OWNERSHIP ===
    NO_CAR_HH:
      table: sas10
      code: 81sas100949
      description: "Households with no car"
      type: raw
      note: "Car deprivation indicator"
    
    PCT_NO_CAR:
      table: sas10
      code: 81sas100949
      description: "No-car households as % of total"
      type: rate
      denominator: TOTAL_HH
      calculation: "100 * NO_CAR_HH / TOTAL_HH"
    
    CAR_OWNERSHIP_INDEX:
      table: sas10
      code: 81sas100949
      description: "Car ownership index (inverse of no-car rate)"
      type: rate
      calculation: "100 - PCT_NO_CAR"
      note: "Composite index: 0=no cars, 100=universal car ownership"
    
    # === OVERCROWDING ===
    OVERCROWD_GT1P5:
      table: sas10
      code: 81sas100945
      description: "Households with >1.5 persons per room"
      type: raw
      note: "Housing quality indicator: severe overcrowding"
    
    PCT_OVERCROWD_GT1P5:
      table: sas10
      code: 81sas100945
      description: "Severely overcrowded households (>1.5 pp/room) as %"
      type: rate
      denominator: TOTAL_HH
      calculation: "100 * OVERCROWD_GT1P5 / TOTAL_HH"
    
    OVERCROWD_1TO1P5:
      table: sas10
      code: 81sas100946
      description: "Households with 1-1.5 persons per room"
      type: raw
      note: "Housing quality indicator: moderate overcrowding"
    
    PCT_OVERCROWD_1TO1P5:
      table: sas10
      code: 81sas100946
      description: "Moderately overcrowded households (1-1.5 pp/room) as %"
      type: rate
      denominator: TOTAL_HH
      calculation: "100 * OVERCROWD_1TO1P5 / TOTAL_HH"
    
    # === AMENITIES DEPRIVATION ===
    NO_BATH_OR_WC:
      table: sas10
      code: 81sas100932
      description: "Households lacking bath or WC"
      type: raw
      note: "Housing deprivation indicator: basic amenities"
    
    PCT_NO_BATH_OR_WC:
      table: sas10
      code: 81sas100932
      description: "Households lacking bath or WC as %"
      type: rate
      denominator: TOTAL_HH
      calculation: "100 * NO_BATH_OR_WC / TOTAL_HH"
    
    NO_INSIDE_BATH_OR_WC:
      table: sas10
      code: 81sas100933
      description: "Households without inside bath or WC"
      type: raw
      note: "Housing deprivation indicator: inside amenities"
    
    PCT_NO_INSIDE_BATH_OR_WC:
      table: sas10
      code: 81sas100933
      description: "Households without inside bath or WC as %"
      type: rate
      denominator: TOTAL_HH
      calculation: "100 * NO_INSIDE_BATH_OR_WC / TOTAL_HH"
    
    # === COMPOSITE HOUSING QUALITY INDEX ===
    HOUSING_QUALITY_INDEX:
      table: sas10
      code: null  # Composite; calculated from multiple fields
      description: "Housing quality composite index (standardized)"
      type: rate
      calculation: "z-score composite of overcrowding + amenities deprivation"
      note: "Optional: Combines PCT_OVERCROWD_GT1P5, PCT_NO_BATH_OR_WC (normalized to 0-1)"

  1991:
    # =====================================================
    # 1991 Census Tables (Verified from variable lookup)
    # =====================================================
    # Core tables: S02EWS (demographics), S06EWS (ethnic group), S07EWS (country of birth),
    #              S09EWS (economic position), S16EW (tenure & amenities)
    # Note: 1991 uses 's0XXXXX' format (no year prefix in raw data)
    
    # =====================================================
    # S02EWS: DEMOGRAPHIC BASE (Total Population)
    # =====================================================
    TOTAL_RES:
      table: s02ews
      code: s020001
      description: "All ages TOTAL Persons (Residents)"
      type: denominator
      note: "Base denominator for all population rates"
    
    TOTAL_MALE:
      table: s02ews
      code: s020002
      description: "All ages Male Persons"
      type: raw
    
    TOTAL_FEMALE:
      table: s02ews
      code: s020005
      description: "All ages Female Persons"
      type: raw
    
    # =====================================================
    # S06EWS: ETHNIC GROUP (PRIMARY for Chinese identification)
    # =====================================================
    CHINESE_ETHNIC:
      table: s06ews
      code: s060009
      description: "Persons of Chinese ethnic group (self-identified)"
      type: raw
      priority: PRIMARY
      note: "Direct ethnic identification - superior to 1981 country-of-birth proxy"
    
    CHINESE_ETHNIC_MALE:
      table: s06ews
      code: s060021
      description: "Chinese ethnic group - Male"
      type: raw
    
    CHINESE_ETHNIC_FEMALE:
      table: s06ews
      code: s060033
      description: "Chinese ethnic group - Female"
      type: raw
    
    CHINESE_AGE_0_4:
      table: s06ews
      code: s060045
      description: "Chinese ethnic group - Age 0-4"
      type: raw
    
    CHINESE_AGE_5_15:
      table: s06ews
      code: s060057
      description: "Chinese ethnic group - Age 5-15"
      type: raw
    
    CHINESE_AGE_16_29:
      table: s06ews
      code: s060069
      description: "Chinese ethnic group - Age 16-29"
      type: raw
    
    CHINESE_AGE_30_PENSION:
      table: s06ews
      code: s060081
      description: "Chinese ethnic group - Age 30 to pensionable age"
      type: raw
    
    CHINESE_PENSIONABLE:
      table: s06ews
      code: s060093
      description: "Chinese ethnic group - Pensionable age and over"
      type: raw
    
    CHINESE_LIMITING_ILLNESS:
      table: s06ews
      code: s060105
      description: "Chinese ethnic group - Has limiting long-term illness"
      type: raw
    
    PCT_CHINESE_ETHNIC:
      table: s06ews
      code: s060009
      description: "Chinese ethnic group as % of total population"
      type: rate
      denominator: TOTAL_RES
      calculation: "100 * CHINESE_ETHNIC / TOTAL_RES"
      note: "Key integration indicator: ethnic presence (1991 direct measure)"
    
    # =====================================================
    # S07EWS: COUNTRY OF BIRTH (SUPPLEMENTARY for comparison)
    # =====================================================
    CHINA_BORN_MALE:
      table: s07ews
      code: s070041
      description: "Persons born in China (PRC) - Male"
      type: raw
    
    CHINA_BORN_FEMALE:
      table: s07ews
      code: s070042
      description: "Persons born in China (PRC) - Female"
      type: raw
    
    CHINA_BORN:
      derived_from: ["CHINA_BORN_MALE", "CHINA_BORN_FEMALE"]
      calculation: "CHINA_BORN_MALE + CHINA_BORN_FEMALE"
      description: "Persons born in China (mainland) - Total"
      type: derived
      note: "For longitudinal comparison with 1981 Far East births"
    
    PCT_CHINA_BORN:
      derived_from: ["CHINA_BORN", "TOTAL_RES"]
      description: "China-born as % of total population"
      type: rate
      denominator: TOTAL_RES
      calculation: "100 * CHINA_BORN / TOTAL_RES"
    
    # =====================================================
    # S09EWS: ECONOMIC POSITION (Chinese-specific)
    # =====================================================
    CHINESE_16PLUS:
      table: s09ews
      code: s090005
      description: "Chinese and other groups - Total (aged 16+)"
      type: raw
      note: "Denominator for Chinese economic activity rates"
    
    CHINESE_ECON_ACTIVE_MALE:
      table: s09ews
      code: s090017
      description: "Chinese economically active - Male"
      type: raw
    
    CHINESE_UNEMPLOYED_MALE:
      table: s09ews
      code: s090023
      description: "Chinese unemployed - Male"
      type: raw
    
    CHINESE_ECON_INACTIVE_MALE:
      table: s09ews
      code: s090029
      description: "Chinese economically inactive - Male"
      type: raw
    
    CHINESE_ECON_ACTIVE_FEMALE:
      table: s09ews
      code: s090041
      description: "Chinese economically active - Female"
      type: raw
    
    CHINESE_UNEMPLOYED_FEMALE:
      table: s09ews
      code: s090047
      description: "Chinese unemployed - Female"
      type: raw
    
    CHINESE_ECON_INACTIVE_FEMALE:
      table: s09ews
      code: s090053
      description: "Chinese economically inactive - Female"
      type: raw
    
    CHINESE_EMP_RATE:
      derived_from: ["CHINESE_ECON_ACTIVE_MALE", "CHINESE_ECON_ACTIVE_FEMALE", "CHINESE_16PLUS"]
      calculation: "100 * (CHINESE_ECON_ACTIVE_MALE + CHINESE_ECON_ACTIVE_FEMALE) / CHINESE_16PLUS"
      description: "Chinese economic activity rate"
      type: rate
    
    # =====================================================
    # S49EW: HOUSEHOLDS BY ETHNIC GROUP (Chinese-specific housing)
    # =====================================================
    CHINESE_HOUSEHOLDS:
      table: s49ew
      code: s490005
      description: "Chinese and other groups - Total households"
      type: denominator
    
    CHINESE_OVERCROWD_1_1P5:
      table: s49ew
      code: s490012
      description: "Chinese households - 1-1.5 persons per room"
      type: raw
    
    CHINESE_OVERCROWD_GT1P5:
      table: s49ew
      code: s490019
      description: "Chinese households - Over 1.5 persons per room"
      type: raw
    
    CHINESE_OWNER_OCC:
      table: s49ew
      code: s490026
      description: "Chinese households - Owner occupied"
      type: raw
    
    PCT_CHINESE_OWNER_OCC:
      derived_from: ["CHINESE_OWNER_OCC", "CHINESE_HOUSEHOLDS"]
      calculation: "100 * CHINESE_OWNER_OCC / CHINESE_HOUSEHOLDS"
      description: "Chinese owner-occupation rate"
      type: rate
    
    PCT_CHINESE_OVERCROWD:
      derived_from: ["CHINESE_OVERCROWD_GT1P5", "CHINESE_HOUSEHOLDS"]
      calculation: "100 * CHINESE_OVERCROWD_GT1P5 / CHINESE_HOUSEHOLDS"
      description: "Chinese severe overcrowding rate (>1.5 pp/room)"
      type: rate

  2001:
    # Placeholder structure for 2001 data
    # Actual SAS codes to be populated after 2001 data ingestion
    TOTAL_RES:
      table: sas02
      code: 01sas020001  # TBD
      description: "All ages TOTAL Persons (Residents)"
      type: denominator
    
    CHINESE_BORN:
      table: sas04
      code: 01sas040359  # TBD
      description: "Total persons born in Far East"
      type: raw
    
    PCT_CHINESE_BORN:
      table: sas04
      code: 01sas040359  # TBD
      description: "Far East-born as % of total population"
      type: rate
      denominator: TOTAL_RES
    
    TOTAL_HH:
      table: sas10
      code: 01sas100929  # TBD
      description: "Households with residents (TOTAL tenure)"
      type: denominator
    
    PCT_NO_CAR:
      table: sas10
      code: 01sas100949  # TBD
      description: "No-car households as % of total"
      type: rate
      denominator: TOTAL_HH

# =====================================================
# METADATA & NOTES
# =====================================================
# 
# Indicator Categories:
# - Demographic base: Population size, age/sex structure
# - Ethnic presence: Far East/Chinese-born prevalence
# - Housing tenure: Owner-occupied, social renting
# - Housing quality: Overcrowding, amenities deprivation
# - Economic position: Employment, unemployment rates
# - Composite indices: Combined deprivation/quality measures
#
# Data Quality Notes:
# - (TBD) codes marked with TBD require verification via 1981_variable_lookup.csv
# - SAS07 codes for employment need verification (exact table structure varies)
# - 1991/2001 codes are placeholders pending data ingestion
# - Missing data (zero counts) should be handled as null, not 0% rates
#
# Calculation Rules:
# - Rates: numerator / denominator * 100
# - Percentages must range 0-100 (check for negative or >100 anomalies)
# - Suppress rates where denominator < 10 (small number suppression)
# - Handle division by zero (null denominators → null rates)
#
# Usage:
# - Load via: config = yaml.safe_load(open('configs/indicators.yml'))
# - Access: config['years']['1981']['TOTAL_RES']['code']
# - Iterate: for year, indicators in config['years'].items(): ...
